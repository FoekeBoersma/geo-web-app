<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Geo Web App</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css?v=20260703" />
</head>

<body>
  <div id="controls">
    <label for="place">Place:</label>
    <input id="place" type="search" placeholder="e.g. Paris" value="Paris" />
    <button id="search">Search</button>
    <span id="status" ></span>
  </div>

  <div id="route-controls">
    <label for="origin">Route:</label>
    <input id="origin" type="search" placeholder="Origin e.g. Amsterdam "/>
    <span>→</span>
    <input id="destination" type="search" placeholder="Destination e.g. Rotterdam"/>
    <button id="route-btn">Get Route</button>
  </div>

  <div id="route-download">
    <label for="origin">Download Route</label>
    <button id="download-btn">Download</button>
  </div>
  <div id="poi-export">
    <button id="export-map-view-svg-btn">Export Map View (SVG)</button>
    <button id="export-poi-extent-svg-btn">Export POI Extent (SVG)</button>
  </div>
  <div id="isochrone-button">
   <input id="minutes-btn" type="search" placeholder="e.g. 15" value="15" />
   <select id="network-type-btn">
      <option value="walk">Walk</option>
      <option value="bike">Bike</option>
      <option value="drive">Drive</option>
    </select>
    <button id="isochrone-btn">Get Isochrone</button>
  </div>

  <div id="map"></div>

  <div id="error"></div>

  <!-- Leaflet JS (before script but after DOM) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js?v=20260703"></script>
</body>
</html>
